<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lone Vector</title>

  <link rel="stylesheet" href="css/game.css" />
  <script src="js/Base.js" type="text/javascript"></script>
  <script src="js/input.js" type="text/javascript"></script>
  <script src="js/game/Rng.js" type="text/javascript"></script>
  <script src="js/game/Sfx.js" type="text/javascript"></script>
  <script src="js/game/Gfx.js" type="text/javascript"></script>
  <script src="js/game/Levels.js" type="text/javascript"></script>
  <script src="js/game/Level.js" type="text/javascript"></script>
  <script src="js/game/Terrain.js" type="text/javascript"></script>
  <script src="js/game/Particles.js" type="text/javascript"></script>
  <script src="js/game/Entities.js" type="text/javascript"></script>
  <script src="js/game/Mission.js" type="text/javascript"></script>
  <script src="js/game/TouchPad.js" type="text/javascript"></script>
  <script src="js/game/Game.js" type="text/javascript"></script>
</head>

<body>

<canvas id="game" width="960" height="640"></canvas>
<div id="footer"><a href="editor.html">mission editor</a></div>

<script>
window.addEventListener('load', function() {
  var canvas = document.getElementById('game')

  var resize = function() {
    var scale = Math.min(window.innerWidth / canvas.width, (window.innerHeight - 4) / canvas.height)
    canvas.style.width = Math.floor(canvas.width * scale) + 'px'
    canvas.style.height = Math.floor(canvas.height * scale) + 'px'
  }
  window.addEventListener('resize', resize)
  resize()

  // audio may only start after a user gesture
  document.addEventListener('keydown', function() {
    Sfx.init()
  })

  Gfx.init()
  window.game = new Game(canvas)
  TouchPad.init(canvas, game)

  // play-testing inside the mission editor: wait for the editor to send the mission
  if(/[?&]playtest/.test(location.search)) {
    document.getElementById('footer').hidden = true
    game.custom = 'editor'
    game.setState('waiting')
    window.addEventListener('message', function(e) {
      if(e.data && e.data.type == 'lv-mission') {
        game.playCustom(e.data.mission, 'editor')
        window.focus()
      }
    })
    if(window.parent != window) window.parent.postMessage({ type: 'lv-ready' }, '*')
  }

  // drop a mission file exported from the editor onto the page to play it
  document.addEventListener('dragover', function(e) {
    e.preventDefault()
  })
  document.addEventListener('drop', function(e) {
    e.preventDefault()
    var file = e.dataTransfer.files[0]
    if(!file) return
    file.text().then(function(text) {
      try {
        game.playCustom(Mission.parse(text), 'file')
      } catch(err) {
        alert('Cannot play this file: ' + err.message)
      }
    })
  })

  game.run()
})
</script>

</body>
</html>
